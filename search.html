<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>搜索笔记 | Yanxi456</title>
  <meta name="description" content="搜索学习笔记" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appleGray: '#fbfbfd',
            appleText: '#1d1d1f',
            appleSecondary: '#86868b',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    .note-content h1 { font-size: 1.875rem; font-weight: 600; margin-bottom: 1rem; }
    .note-content h2 { font-size: 1.5rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
    .note-content h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .note-content p { margin-bottom: 1rem; line-height: 1.75; }
    .note-content ul, .note-content ol { margin-left: 1.5rem; margin-bottom: 1rem; }
    .note-content li { margin-bottom: 0.25rem; }
    .note-content pre { background: #f6f8fa; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
    .note-content code { font-family: 'SF Mono', Consolas, monospace; font-size: 0.875rem; }
    .note-content :not(pre) > code { background: #f6f8fa; padding: 0.125rem 0.375rem; border-radius: 0.25rem; }
    .note-content blockquote { border-left: 4px solid #d1d5db; padding-left: 1rem; color: #6b7280; margin-bottom: 1rem; }
    .note-content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .note-content th, .note-content td { border: 1px solid #e5e7eb; padding: 0.5rem; text-align: left; }
    .note-content th { background: #f9fafb; }
    .search-result { cursor: pointer; }
    .search-result:hover { background: #f9fafb; }
    .search-result.active { background: #f3f4f6; border-left: 3px solid #1d1d1f; }
    .highlight { background: #fef08a; padding: 0 2px; border-radius: 2px; }
  </style>
</head>
<body class="bg-white text-appleText antialiased">
  <div class="min-h-screen bg-gradient-to-b from-white to-appleGray/50">
    <!-- 顶部导航 -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <!-- 左侧：返回首页 + 校徽 + 学校名称 -->
        <div class="flex items-center gap-3">
          <a href="index.html" class="flex items-center gap-2 text-appleSecondary hover:text-appleText transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            返回
          </a>
          <img
            src="logo.svg"
            alt="中山大学校徽"
            class="h-10 w-10 object-contain"
            loading="lazy"
          />
          <div>
            <p class="text-xs text-appleSecondary">中山大学</p>
            <p class="text-sm font-medium text-appleText">网络空间安全学院</p>
          </div>
        </div>

        <!-- 右侧：用户名 + 头像 + GitHub 按钮 -->
        <div class="flex items-center gap-4">
          <span class="text-sm font-medium text-appleText">Yanxi456</span>
          <img
            src="https://github.com/Yanxi456.png"
            alt="Yanxi456"
            class="h-9 w-9 rounded-full border border-gray-200"
            loading="lazy"
          />
          <a
            href="https://github.com/Yanxi456"
            target="_blank"
            rel="noreferrer"
            class="group relative px-4 py-2 text-sm font-medium text-white bg-gray-900 rounded-lg overflow-hidden transition-all hover:shadow-lg hover:shadow-gray-400/20"
          >
            <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-gray-700 via-gray-600 to-gray-700 opacity-0 group-hover:opacity-100 transition-opacity"></span>
            <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/10 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></span>
            <span class="relative flex items-center gap-2">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0012 2z"/>
              </svg>
              GitHub
            </span>
          </a>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="max-w-4xl mx-auto px-6 py-8">
      <!-- 搜索框 -->
      <div class="mb-8">
        <div class="relative">
          <input
            type="text"
            id="search-input"
            class="w-full px-5 py-4 text-lg border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent shadow-sm"
            placeholder="搜索笔记标题、内容或标签..."
            autofocus
          />
          <button
            id="search-btn"
            class="absolute right-3 top-1/2 -translate-y-1/2 p-2 bg-gray-900 text-white rounded-lg hover:bg-gray-700 transition-colors"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>
        <p class="mt-2 text-sm text-appleSecondary">支持按标题、内容全文搜索</p>
      </div>

      <!-- 搜索模式切换 -->
      <div class="flex gap-4 mb-6 border-b border-gray-200">
        <button data-mode="all" class="search-mode-btn px-4 py-2 text-sm font-medium border-b-2 border-gray-900 text-gray-900">
          全部
        </button>
        <button data-mode="算法与数据结构" class="search-mode-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-appleSecondary hover:text-gray-900">
          算法与数据结构
        </button>
        <button data-mode="数论与数学" class="search-mode-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-appleSecondary hover:text-gray-900">
          数论与数学
        </button>
        <button data-mode="工程实践" class="search-mode-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-appleSecondary hover:text-gray-900">
          工程实践
        </button>
        <button data-mode="理论随笔" class="search-mode-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-appleSecondary hover:text-gray-900">
          理论随笔
        </button>
      </div>

      <!-- 搜索结果 -->
      <div id="search-results" class="space-y-4">
        <p class="text-center text-appleSecondary py-12">
          输入关键词开始搜索...
        </p>
      </div>

      <!-- 笔记阅读区域 -->
      <div id="note-viewer" class="hidden">
        <div class="bg-white border border-gray-200 rounded-xl p-6">
          <div class="flex items-center justify-between mb-6">
            <button id="back-to-search" class="flex items-center gap-2 text-appleSecondary hover:text-appleText transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
              返回搜索
            </button>
            <h2 id="note-title" class="text-xl font-semibold"></h2>
            <div class="w-16"></div>
          </div>
          <div id="note-content" class="note-content prose max-w-none"></div>
          <div id="pdf-container" class="hidden">
            <embed id="pdf-viewer" type="application/pdf" width="100%" height="600px" />
          </div>
        </div>
      </div>
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-gray-100 py-8">
      <div class="max-w-7xl mx-auto px-6 text-center text-sm text-appleSecondary">
        <p>&copy; 2024 Yanxi456. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script src="search.js"></script>
</body>
</html>
